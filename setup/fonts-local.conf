<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Fallback chain for the DHE deck: keep missing glyphs on quality faces,
       never on unifont/ipag bitmap fonts. -->
  <match target="pattern">
    <test name="family"><string>Inter</string></test>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>JetBrains Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Inter</string></edit>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <!-- Push bitmap catch-alls to the very end of every fallback list. -->
  <selectfont><rejectfont>
    <pattern><patelt name="family"><string>Unifont</string></patelt></pattern>
    <pattern><patelt name="family"><string>Unifont Sample</string></patelt></pattern>
    <pattern><patelt name="family"><string>Unifont JP</string></patelt></pattern>
    <pattern><patelt name="family"><string>Unifont JP Sample</string></patelt></pattern>
  </rejectfont></selectfont>
</fontconfig>
